name: wp-headless

services:
  db:
    image: mysql:8.0
    container_name: wph-db
    restart: unless-stopped
    command:
      # MySQL 8 defaults to caching_sha2_password, which older PHP MySQL
      # clients cannot negotiate. WordPress/PHP 8.3 handles either, but
      # keeping native_password avoids surprises when connecting by hand.
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [wpnet]

  wordpress:
    image: wordpress:php8.3-apache
    container_name: wph-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DEBUG: 1
      # WP_HOME/WP_SITEURL must match the address the browser actually uses,
      # otherwise every admin redirect and every media URL points somewhere
      # unreachable. Local by default; a Codespace overwrites WP_URL with its
      # forwarded address - see .devcontainer/setup.sh.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_URL}');
        define('WP_SITEURL', '${WP_URL}');
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html
      # Our custom plugin is bind-mounted rather than baked into the image,
      # so editing PHP here is picked up immediately with no rebuild.
      - ./wp-plugins/headless-blocks:/var/www/html/wp-content/plugins/headless-blocks
    networks: [wpnet]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wph-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    networks: [wpnet]

  # One-shot CLI. Not started by `up`; invoke with:
  #   docker compose run --rm wpcli <args>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    # The CLI image is Alpine (www-data is uid 82) but the WordPress image is
    # Debian (www-data is uid 33). The shared volume is owned by 33, so without
    # pinning the CLI to 33 it cannot write to it at all and `plugin install`
    # fails with "Could not create directory".
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      # uid 33 has no writable home directory in this image, so wp-cli is
      # pointed at /tmp for its cache instead of warning on every invocation.
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp-plugins/headless-blocks:/var/www/html/wp-content/plugins/headless-blocks
      # Read-only access to the seed script, so demo content can be rebuilt
      # from source with `wp eval-file /seed/seed.php`.
      - ./seed:/seed:ro
    entrypoint: ["wp"]
    networks: [wpnet]

volumes:
  db_data:
  wp_data:

networks:
  wpnet:
